var _lastSyncHash="";
// Fusion intelligente par enregistrement : préserve les ajouts locaux, prend le plus récent en cas de conflit
function smartMerge(local,server,keyFn){
  if(!Array.isArray(local)||!Array.isArray(server))return server||local||[];
  var sMap={};server.forEach(function(r){var k=keyFn(r);if(k!=null)sMap[k]=r;});
  var lMap={};local.forEach(function(r){var k=keyFn(r);if(k!=null)lMap[k]=r;});
  var merged=[];
  server.forEach(function(srv){
    var k=keyFn(srv);if(k==null){merged.push(srv);return;}
    var loc=lMap[k];
    if(!loc){merged.push(srv);}
    else{var st=new Date(srv._ts||0).getTime(),lt=new Date(loc._ts||0).getTime();merged.push(lt>=st?loc:srv);}
  });
  local.forEach(function(loc){var k=keyFn(loc);if(k==null||!sMap[k])merged.push(loc);});
  return merged;
}
function cloudPoll(setters,onUpdate){
  if(!SYNC_ENABLED)return;

  }).then(function(r){return r.json();}).then(function(rows){
    // Hash basé sur le contenu (pas updated_at) — évite la boucle useEffect→cloudSave→trigger→updated_at
    var dataStr=rows.map(function(r){return r.id+":"+JSON.stringify(r.data);}).join("|");
    var h=0;for(var i=0;i<dataStr.length;i++){h=((h<<5)-h)+dataStr.charCodeAt(i);h|=0;}
    var hash=h.toString(36);
    if(hash===_lastSyncHash)return;
    _lastSyncHash=hash;
    var map={};rows.forEach(function(r){map[r.id]=r.data;});
    // Fusion par enregistrement — préserve les ajouts locaux hors ligne
    if(map.mg_enr)setters.enr(function(l){return smartMerge(l,map.mg_enr,function(r){return r.code;});});
    if(map.mg_ei)setters.ei(function(l){return smartMerge(l,map.mg_ei,function(r){return r.code;});});
    if(map.mg_maint)setters.maint(function(l){return smartMerge(l,map.mg_maint,function(r){return r.equipement;});});
    if(map.mg_mc)setters.mc(map.mg_mc);
    if(map.mg_pm)setters.pm(map.mg_pm);
    if(map.mg_tol)setters.tol(map.mg_tol);

// ─── SAUVEGARDE JOURNALIÈRE SUPABASE ────────────────────────────────────
// Lit directement depuis Supabase (pas de dépendance au state React)
// Crée backup_metro_YYYY-MM-DD + backup_maint_YYYY-MM-DD — 1 fois par jour
// Conserve 30 jours d'historique, nettoie automatiquement les anciens
function triggerDailyBackup(notify){
  if(!SYNC_ENABLED)return;
  var today=new Date().toISOString().slice(0,10);
  var metroKey="backup_metro_"+today;
  var maintKey="backup_maint_"+today;
  fetch(SUPABASE_URL+"/rest/v1/data_store?or=(id.eq."+metroKey+",id.eq."+maintKey+")&select=id",{
    headers:{"apikey":SUPABASE_KEY,"Authorization":"Bearer "+SUPABASE_KEY}
  }).then(function(r){return r.json();}).then(function(existing){
    var done=(existing||[]).map(function(r){return r.id;});
    if(done.indexOf(metroKey)>=0&&done.indexOf(maintKey)>=0)return; // Déjà fait aujourd'hui
    fetch(SUPABASE_URL+"/rest/v1/data_store?or=(module.eq.metrologie,module.eq.maintenance,module.eq.shared)&select=id,module,data",{
      headers:{"apikey":SUPABASE_KEY,"Authorization":"Bearer "+SUPABASE_KEY}
    }).then(function(r){return r.json();}).then(function(rows){
      var metro={},maint={},shared={};
      rows.forEach(function(r){
        if(r.module==="metrologie")metro[r.id]=r.data;
        else if(r.module==="maintenance")maint[r.id]=r.data;
        else if(r.module==="shared")shared[r.id]=r.data;
      });
      var saves=[];
      if(done.indexOf(metroKey)<0&&Object.keys(metro).length>0)
        saves.push(fetch(SUPABASE_URL+"/rest/v1/data_store",{method:"POST",
          headers:{"apikey":SUPABASE_KEY,"Authorization":"Bearer "+SUPABASE_KEY,"Content-Type":"application/json","Prefer":"resolution=merge-duplicates"},
          body:JSON.stringify({id:metroKey,module:"backup",data:{_date:today,_module:"metrologie",content:Object.assign({},metro,shared)}})}));
      if(done.indexOf(maintKey)<0&&Object.keys(maint).length>0)
        saves.push(fetch(SUPABASE_URL+"/rest/v1/data_store",{method:"POST",
          headers:{"apikey":SUPABASE_KEY,"Authorization":"Bearer "+SUPABASE_KEY,"Content-Type":"application/json","Prefer":"resolution=merge-duplicates"},
          body:JSON.stringify({id:maintKey,module:"backup",data:{_date:today,_module:"maintenance",content:Object.assign({},maint,shared)}})}));
      if(!saves.length)return;
      Promise.all(saves).then(function(){
        // Nettoyage automatique : supprimer les backups de plus de 30 jours
        var cutoff=new Date();cutoff.setDate(cutoff.getDate()-30);
        fetch(SUPABASE_URL+"/rest/v1/data_store?module=eq.backup&updated_at=lt."+cutoff.toISOString(),{
          method:"DELETE",headers:{"apikey":SUPABASE_KEY,"Authorization":"Bearer "+SUPABASE_KEY,"Prefer":"return=minimal"}
        }).catch(function(){});
        if(notify)notify("Sauvegarde journalière Supabase effectuée — "+today);
      }).catch(function(){});
    }).catch(function(){});
  }).catch(function(){});
}

var STORAGE_BUCKET = "documents";
var MAX_FILE_SIZE = 10 * 1024 * 1024; // 10 Mo

function uploadToStorage(file, folder, callback) {
  if (file.size > MAX_FILE_SIZE) { callback("Fichier trop volumineux (max 10 Mo)"); return; }
  var ts = Date.now();
  var safeName = file.name.replace(/[^a-zA-Z0-9._-]/g, "_");
  var path = folder + "/" + ts + "_" + safeName;
  fetch(SUPABASE_URL + "/storage/v1/object/" + STORAGE_BUCKET + "/" + path, {
    method: "POST",
    headers: { "apikey": SUPABASE_KEY, "Authorization": "Bearer " + SUPABASE_KEY, "Content-Type": file.type, "x-upsert": "true" },
    body: file
  }).then(function(r) {
    if (r.ok) {
      var publicUrl = SUPABASE_URL + "/storage/v1/object/public/" + STORAGE_BUCKET + "/" + path;
      callback(null, publicUrl, path);
    } else { r.json().then(function(err) { callback(err.message || err.error || "Erreur upload"); }).catch(function() { callback("Erreur upload"); }); }
  }).catch(function() { callback("Erreur réseau"); });
}

function deleteFromStorage(path, callback) {
  fetch(SUPABASE_URL + "/storage/v1/object/" + STORAGE_BUCKET + "/" + path, {
    method: "DELETE",
    headers: { "apikey": SUPABASE_KEY, "Authorization": "Bearer " + SUPABASE_KEY }
  }).then(function() { callback(null); }).catch(function() { callback("Erreur suppression"); });
}

function computeDiff(oldObj,newObj){
  if(!oldObj||!newObj)return[];
  var skip=["fileUrl","filePath","uploadedAt"];
  var changes=[];
  var allKeys=Object.keys(Object.assign({},oldObj,newObj));
  allKeys.forEach(function(k){
    if(skip.indexOf(k)>=0)return;
    var ov=oldObj[k]===undefined?"":oldObj[k];
    var nv=newObj[k]===undefined?"":newObj[k];
    if(JSON.stringify(ov)!==JSON.stringify(nv))changes.push({champ:k,avant:String(ov),apres:String(nv)});
  });
  return changes;
}

  function checkConflicts(){
    if(!SYNC_ENABLED)return;
    cloudLoadAll(function(map){
      if(!map)return;
      if(map.mg_backups)localStorage.setItem("mg_backups",JSON.stringify(map.mg_backups));
      // Fusion automatique par enregistrement — plus de modal bloquant
      var ajouts=0,ecrases=0;
      function applyMerge(local,server,keyFn,setter){
        if(!server)return;
        var lMap={};local.forEach(function(r){var k=keyFn(r);if(k)lMap[k]=r;});
        server.forEach(function(srv){
          var k=keyFn(srv);if(!k)return;
          if(!lMap[k]){ajouts++;}
          else if(srv._ts&&lMap[k]._ts&&new Date(srv._ts)>new Date(lMap[k]._ts)){ecrases++;}
        });
        setter(smartMerge(local,server,keyFn));
      }
      if(map.mg_enr)applyMerge(enr,map.mg_enr,function(r){return r.code;},setEnr);
      if(map.mg_ei)applyMerge(ei,map.mg_ei,function(r){return r.code;},setEI);
      if(map.mg_maint)applyMerge(maint,map.mg_maint,function(r){return r.equipement;},setMaint);
      if(map.mg_mc)setMC(map.mg_mc);
      if(map.mg_maintInter)applyMerge(maintInter,map.mg_maintInter,function(r){return r.id;},setMaintInter);
      if(map.mg_pm)setPM(map.mg_pm);
      if(map.mg_tol)setTol(map.mg_tol);
      if(map.mg_docs)applyMerge(docs,map.mg_docs,function(r){return r.id;},setDocs);
      if(map.pharmashield_societe)setSoc(map.pharmashield_societe);
      // Toast informatif discret — uniquement si quelque chose a changé
      var msg=[];
      if(ajouts>0)msg.push(ajouts+" ajout(s) du serveur intégré(s)");
      if(ecrases>0)msg.push(ecrases+" fiche(s) mise(s) à jour — voir le journal");
      if(msg.length>0)setTimeout(function(){showToast("Sync : "+msg.join(" · "));},400);
    });
  }

  function resolveConflict(choice){
    if(!conflictData)return;
    if(choice==="server"){
      createBackup("Avant remplacement par les donnees serveur");
      var map=conflictData.map;
      if(map.mg_backups)localStorage.setItem("mg_backups",JSON.stringify(map.mg_backups));
      if(map.mg_enr)setEnr(function(l){return smartMerge(l,map.mg_enr,function(r){return r.code;});});
      if(map.mg_ei)setEI(function(l){return smartMerge(l,map.mg_ei,function(r){return r.code;});});
      if(map.mg_maint)setMaint(function(l){return smartMerge(l,map.mg_maint,function(r){return r.equipement;});});
      if(map.mg_mc)setMC(map.mg_mc);
      if(map.mg_maintInter)setMaintInter(function(l){return smartMerge(l,map.mg_maintInter,function(r){return r.id;});});
      if(map.mg_pm)setPM(map.mg_pm);
      if(map.mg_tol)setTol(map.mg_tol);
      if(map.mg_docs)setDocs(function(l){return smartMerge(l,map.mg_docs,function(r){return r.id;});});
      if(map.pharmashield_societe)setSoc(map.pharmashield_societe);
      showToast("Donnees serveur chargees — backup local cree");
    } else if(choice==="local"){
      showToast("Donnees locales conservees — elles seront synchronisees");
    } else if(choice==="export"){
      var data={enregistreurs:enr,equipIntermed:ei,maintenanceItems:maint,maintenanceInterventions:maintInter,documents:docs,societe:soc,_exportReason:"Sauvegarde avant sync",_date:new Date().toISOString()};
      var json=JSON.stringify(data,null,2);
      var blob=new Blob([json],{type:"application/json"});
      var url=URL.createObjectURL(blob);
      var a=document.createElement("a");
      a.href=url;a.download="pharmashield-metrologie-backup-"+new Date().toISOString().slice(0,10)+".json";
      document.body.appendChild(a);a.click();document.body.removeChild(a);URL.revokeObjectURL(url);
      showToast("Donnees locales exportees — chargement des donnees serveur");
      resolveConflict("server");return;
    }
    setConflictData(null);setConflictStep("initial");setConflictChecked(false);
  }
